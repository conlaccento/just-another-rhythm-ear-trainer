<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prova player</title>
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fff; --hl: #b3261e; }
      @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #16181d; --hl: #ff8a80; } }
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--fg); }
      form { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; align-items: end; }
      label { display: grid; gap: 2px; font-size: 14px; }
      .vf-current { color: var(--hl); }
      .vf-marker { fill: var(--hl); }
      pre { font-size: 12px; max-height: 300px; overflow: auto; }
    </style>
  </head>
  <body>
    <form id="controls">
      <label>Seed <input name="seed" value="player" size="10" /></label>
      <label>Metro <select name="meter"><option>2/4</option><option>3/4</option><option selected>4/4</option><option>6/8</option><option>9/8</option><option>12/8</option></select></label>
      <label>BPM <input name="bpm" type="number" min="40" max="160" value="80" /></label>
      <label>Timbro <select name="timbre"><option value="synth">synth</option><option value="percussion">percussione</option></select></label>
      <label><span>Metronomo</span><input name="metronome" type="checkbox" /></label>
      <button type="button" id="play">Ascolta</button>
      <button type="button" id="stop">Stop</button>
    </form>
    <p id="state" aria-live="polite">idle</p>
    <div id="out"></div>
    <pre id="log"></pre>
    <script type="module" src="./playerDemo.ts"></script>
  </body>
</html>
